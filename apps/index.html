<!DOCTYPE html>
<head>
  <meta name="google-adsense-account" content="ca-pub-1459994917002906">
  <title>snackersgm - apps</title>
  
  <style>
    body {
      background: linear-gradient(to right, #46c7a9, #b175eb);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Arial', sans-serif;
    }

    h1 {
      color: white;
      font-family: 'Comic Sans MS', cursive;
      font-size: 80px;
      text-align: center;
      margin-bottom: 50px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    }

    div.container {
      text-align: center;
      color: white;
      font-family: 'Comic Sans MS', cursive;
      margin-bottom: 30px;
    }

    a {
      font-size: 20px;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    a:hover {
      background-color: #45a049;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px; /* Space between buttons */
      margin-top: 20px;
    }

    .game-button {
      background-color: #04AA6D;
      border: none;
      padding: 15px 32px;
      color: white;
      font-size: 18px;
      text-align: center;
      border-radius: 8px;
      width: 250px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
    }

    .game-button img {
      width: 40px;
      height: 40px;
      border-radius: 5px;
    }

    .game-button:hover {
      background-color: #45a049;
      transform: scale(1.05);
    }

    .game-button img:hover {
      transform: rotate(10deg);
    }

  </style>
</head>

<body>
  <h1>Apps</h1>
  
  <div class="container">
    <a href="/" >go to homepage</a>
  </div>

  <div class="button-container">
    <button class="game-button" onclick="window.location.href='calculator/index.html';">
      <span>Calculator</span>
    </button>

    <button class="game-button" onclick="window.location.href='htmlcoder/index.html';">
      <span>HTML Coder</span>
    </button>

    <button class="game-button" onclick="window.location.href='etchasketch/index.html';">
      <span>Etch a Sketch</span>
    </button>

    <button class="game-button" onclick="window.location.href='emulatorjs/index.html';">
      <span>EmulatorJS</span>
    </button>
  </div>

</body>
</html>
