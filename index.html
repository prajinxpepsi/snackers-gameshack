<html lang="en">

<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1459994917002906"
     crossorigin="anonymous"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Snacker's Game Shack</title>
  <style>
    /* Apply a transform to make the body slide down */
    body {
      background: linear-gradient(to right, #46c7a9, #b175eb);
      animation: background 5s linear infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      transform: translateY(-100%); /* Start off-screen at the top */
      animation: slideDown 0.5s ease-out forwards, background 5s linear infinite; /* Slide down quickly and background animation */
    }

    /* Animation for sliding the body down */
    @keyframes slideDown {
      0% {
        transform: translateY(-100%); /* Start off-screen above */
      }
      100% {
        transform: translateY(0); /* End at the normal position */
      }
    }

    @keyframes background {
      100% {
        filter: hue-rotate(350deg);
      }
    }

    /* Styling for main title (h1) */
    h1 {
      color: white;
      font-family: "Comic Sans MS", sans-serif;
      font-size: 100px;
      transition: transform 0.3s ease; /* Smooth transition on hover */
    }

    /* Hover effect for h1 */
    h1:hover {
      transform: scale(1.1); /* Slightly enlarge the text */
    }

    /* Styling for subheading (h2) */
    h2 {
      color: white;
      font-family: "Comic Sans MS", sans-serif;
      font-size: 30px;
      transition: transform 0.3s ease; /* Smooth transition on hover */
    }

    /* Hover effect for h2 */
    h2:hover {
      transform: scale(1.1); /* Slightly enlarge the text */
    }

    p {
      font-family: verdana;
      font-size: 20px;
    }

    /* Button container styles */
    .button-container {
      display: flex;
      justify-content: center; /* Centers buttons horizontally */
      gap: 20px; /* Adds space between buttons */
    }

    /* Styling for the links (buttons) */
    a {
      font-family: "Comic Sans MS", sans-serif; /* Fallback font */
      font-size: 25px;
      background-color: #04AA6D; /* Green */
      text-decoration: none;
      color: white;
      padding: 10px;
      border-radius: 10px; /* Rounded corners */
      width: 150px; /* Fixed width */
      height: 50px; /* Fixed height */
      line-height: 50px; /* Centers text vertically */
      text-align: center; /* Centers text horizontally */
      display: inline-block; /* Ensures proper box model for width/height */
    }

    a:hover {
      background-color: #45a049; /* Darker green when hovering */
    }
  </style>
</head>

<body>

  <h1>Snacker's Game Shack</h1>
  <h2>website designed by @prajinxpepsi</h2>

  </div>

</body>

</html>
