			 <script>
        function searchGames() {
            const input = document.getElementById('search');
            const filter = input.value.toLowerCase(); // Convert search input to lowercase
            const buttons = document.getElementsByClassName('game-button'); // Get all buttons

            // Loop through all the buttons and filter based on text content
            for (let i = 0; i < buttons.length; i++) {
                const gameName = buttons[i].textContent.toLowerCase(); // Get the button's name
                if (gameName.indexOf(filter) > -1) {
                    buttons[i].style.display = ""; // Show button
                } else {
                    buttons[i].style.display = "none"; // Hide button
                }
            }
        }
    </script>
